[build-system]
requires = ["setuptools>=65.6,<81.0", "wheel>=0.37.1,<0.46.0"]
build-backend = "setuptools.build_meta"

[project]
name         = "PyChromecast"
version      = "14.0.9"
license      = {text = "MIT"}
description  = "Python module to talk to Google Chromecast."
readme       = "README.rst"
authors      = [
    {name = "Paulus Schoutsen", email = "paulus@paulusschoutsen.nl"}
]
requires-python = ">=3.11.0"
dependencies = [
    "protobuf>=4.25.1",
    "zeroconf>=0.25.1",
    "casttube>=0.2.0",
]
classifiers=[
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://github.com/home-assistant-libs/pychromecast"

[project.optional-dependencies]
test = [
    "beautifulsoup4==4.13.5",
    "black==25.1.0",
    "flake8==7.3.0",
    "mypy==1.15.0",
    "PlexAPI==4.17.1",
    "pylint==3.3.8",
    "rstcheck==6.2.5",
    "types-beautifulsoup4==4.12.0.20250516",
    "types-html5lib==1.1.11.20250809",
    "types-protobuf==5.29.1.20250403",
    "types-requests==2.32.4.20250809",
    "yle-dl==20240927",
]

[tool.black]
exclude = 'pb2'

[tool.rstcheck]
# README.rst has embedded python examples which show the interactive interpreter output
# that's not valid Python, so we disable the check
ignore_languages = ["python"]

[tool.setuptools]
platforms = ["any"]
zip-safe  = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["pychromecast*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
